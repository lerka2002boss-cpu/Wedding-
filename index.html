<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Дмитрий & Валерия</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Montserrat',sans-serif;
    background:#eef5ff;
    overflow-x:hidden;
    color:#506da8;
}

/* ---------- Первый экран ---------- */

.hero{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:40px 20px;

    position:relative;

    overflow:hidden;

    background:linear-gradient(180deg,#f8fbff,#edf4ff);

}

/* Летающие частицы */

.hero::before{

content:"";

position:absolute;

width:100%;

height:100%;

background-image:
radial-gradient(circle,rgba(255,255,255,.9) 2px,transparent 2px),
radial-gradient(circle,rgba(255,255,255,.5) 1px,transparent 1px);

background-size:120px 120px,70px 70px;

animation:float 25s linear infinite;

opacity:.6;

}

@keyframes float{

0%{transform:translateY(0);}

100%{transform:translateY(-120px);}

}

.card{

position:relative;

z-index:2;

background:rgba(255,255,255,.88);

backdrop-filter:blur(10px);

border-radius:30px;

padding:35px;

width:100%;

max-width:520px;

text-align:center;

box-shadow:0 20px 50px rgba(120,150,220,.15);

}

.photo{

width:100%;

height:380px;

object-fit:cover;

border-radius:22px;

box-shadow:0 10px 30px rgba(0,0,0,.15);

margin-bottom:30px;

}

h1{

font-family:'Cormorant Garamond',serif;

font-size:58px;

font-weight:600;

color:#6c86d8;

margin-bottom:10px;

}

.date{

font-size:22px;

margin-bottom:25px;

letter-spacing:2px;

color:#8aa0e5;

}

.subtitle{

font-size:18px;

line-height:1.8;

margin-bottom:35px;

color:#6b79a8;

}

button{

background:#8ca8ef;

color:white;

border:none;

padding:18px 42px;

font-size:17px;

border-radius:50px;

cursor:pointer;

transition:.3s;

font-family:'Montserrat',sans-serif;

}

button:hover{

transform:translateY(-3px);

box-shadow:0 10px 25px rgba(140,168,239,.35);

}
/* ---------- Дорогие гости ---------- */

.welcome{
    max-width:800px;
    margin:100px auto;
    padding:0 25px;
    text-align:center;
}

.welcome h2{
    font-family:'Cormorant Garamond',serif;
    font-size:52px;
    color:#6c86d8;
    margin-bottom:30px;
}

.welcome p{
    font-size:20px;
    line-height:1.9;
    color:#6b79a8;
    margin-bottom:20px;
}
</style>
<body>

<section class="hero">

<div class="card">

<img src="hero.jpg" class="photo" alt="Дмитрий и Валерия">

<h1>Дмитрий &amp; Валерия</h1>

<div class="date">
21 августа 2026
</div>


<button>
Открыть приглашение
</button>

</div>

</section>
<section class="welcome">

    <h2>Дорогие гости!</h2>

    <p>
        Совсем скоро состоится один из самых счастливых дней
        нашей жизни.
    </p>

    <p>
        Мы будем счастливы разделить этот день вместе с вами
        и сохранить эти тёплые воспоминания на долгие годы.
    </p>

</section>
<script src="script.js"></script>  
</body>
</html>
