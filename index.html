<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Дмитрий & Валерия</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Montserrat',sans-serif;
    background:#eef5ff;
    color:#506da8;
    overflow-x:hidden;
}

.hero{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
    background:linear-gradient(180deg,#f8fbff,#edf4ff);
}

.card{
    background:rgba(255,255,255,.88);
    border-radius:30px;
    padding:35px;
    max-width:520px;
    width:100%;
    text-align:center;
    box-shadow:0 20px 50px rgba(120,150,220,.15);
}

.photo{
    width:100%;
    height:380px;
    object-fit:cover;
    border-radius:22px;
    margin-bottom:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h1{
    font-family:'Cormorant Garamond',serif;
    font-size:58px;
    color:#6c86d8;
    margin-bottom:15px;
}

.date{
    font-size:22px;
    color:#8aa0e5;
    margin-bottom:35px;
}

button{
    border:none;
    cursor:pointer;
    background:#8ca8ef;
    color:white;
    padding:18px 42px;
    border-radius:50px;
    font-size:17px;
    transition:.3s;
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(140,168,239,.35);
}
    .welcome{
    max-width:800px;
    margin:100px auto;
    padding:0 25px;
    text-align:center;
}

.welcome h2{
    font-family:'Cormorant Garamond',serif;
    font-size:52px;
    color:#6c86d8;
    margin-bottom:30px;
}

.welcome p{
    font-size:20px;
    line-height:1.9;
    color:#6b79a8;
    margin-bottom:20px;
}
/* ---------- Таймер ---------- */

.countdown{
    max-width:900px;
    margin:100px auto;
    text-align:center;
    padding:0 20px;
}

.countdown h2{
    font-family:'Cormorant Garamond',serif;
    font-size:50px;
    color:#6c86d8;
    margin-bottom:40px;
}

#timer{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.time-box{
    width:120px;
    padding:25px 15px;
    background:rgba(255,255,255,.9);
    border-radius:25px;
    box-shadow:0 15px 35px rgba(120,150,220,.15);
}

.time-box span{
    display:block;
    font-size:42px;
    font-weight:600;
    color:#6c86d8;
}

.time-box small{
    display:block;
    margin-top:10px;
    color:#7b8dbd;
    font-size:15px;
    letter-spacing:1px;
}
</style>

</head>

<body>

<section class="hero">

<div class="card">

<img src="hero.jpg" class="photo" alt="Дмитрий и Валерия">

<h1>Дмитрий &amp; Валерия</h1>

<div class="date">
21 августа 2026
</div>

<button onclick="document.getElementById('welcome').scrollIntoView({behavior:'smooth'})">
Открыть приглашение
</button>

</div>

</section>

<section class="welcome" id="welcome">

<h2>Дорогие гости!</h2>

<p>
Совсем скоро состоится один из самых счастливых дней нашей жизни.
</p>

<p>
Мы будем счастливы разделить этот день вместе с вами и сохранить эти тёплые воспоминания на долгие годы.
</p>

</section>
<section class="countdown">

<h2>До нашей свадьбы осталось</h2>

<div id="timer">

<div class="time-box">
<span id="days">00</span>
<small>дней</small>
</div>

<div class="time-box">
<span id="hours">00</span>
<small>часов</small>
</div>

<div class="time-box">
<span id="minutes">00</span>
<small>минут</small>
</div>

<div class="time-box">
<span id="seconds">00</span>
<small>секунд</small>
</div>

</div>

</section>
<script>
const weddingDate = new Date("August 21, 2026 00:00:00").getTime();

function updateTimer() {

    const now = new Date().getTime();
    const distance = weddingDate - now;

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;
}

updateTimer();
setInterval(updateTimer, 1000);
</script>
</body>
</html>
