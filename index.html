<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дмитрий & Валерия</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: "Georgia", serif;
            background: linear-gradient(180deg,#ffffff,#eef5ff);
            color:#243b6b;
            text-align:center;
            overflow-x:hidden;
        }

        .hero{
            min-height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        h1{
            font-size:52px;
            margin-bottom:15px;
        }

        h2{
            font-size:24px;
            color:#6b7fa8;
            margin-bottom:35px;
        }

        p{
            font-size:20px;
            max-width:700px;
            line-height:1.7;
            margin-bottom:35px;
        }

        button{
            background:#6f95d8;
            color:white;
            border:none;
            padding:18px 45px;
            border-radius:40px;
            font-size:20px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            transform:scale(1.05);
            background:#4f78c6;
        }
    </style>
</head>

<body>

<section class="hero">

<h1>Дмитрий & Валерия</h1>

<h2>21 августа 2026</h2>

<p>
Мы будем счастливы разделить с вами
один из самых важных дней нашей жизни.
</p>

<button onclick="alert('Совсем скоро здесь откроется красивое свадебное приглашение ❤️')">
Открыть приглашение
</button>

</section>

</body>
</html>
