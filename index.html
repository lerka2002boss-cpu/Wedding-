<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дмитрий & Валерия</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Georgia, serif;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      background:linear-gradient(135deg,#6f86d6,#c7d2ff,#ffffff);
      color:white;
      overflow:hidden;
    }

    .card{
      background:rgba(255,255,255,.15);
      backdrop-filter:blur(12px);
      padding:50px;
      border-radius:30px;
      box-shadow:0 10px 40px rgba(0,0,0,.2);
      max-width:700px;
    }

    h1{
      font-size:56px;
      margin-bottom:15px;
    }

    h2{
      font-weight:normal;
      margin-bottom:30px;
      font-size:28px;
    }

    p{
      font-size:20px;
      line-height:1.7;
      margin-bottom:35px;
    }

    button{
      background:white;
      color:#5a74c9;
      border:none;
      border-radius:50px;
      padding:18px 45px;
      font-size:18px;
      cursor:pointer;
      transition:.3s;
    }

    button:hover{
      transform:scale(1.05);
    }
  </style>
</head>

<body>

<div class="card">
  <img src="hero.jpg" class="hero-image">
  <h1>Дмитрий & Валерия</h1>

  <h2>21 августа 2026</h2>

  <p>
    Мы будем счастливы разделить с вами
    один из самых важных дней нашей жизни.
  </p>

  <button>Открыть приглашение</button>
</div>

</body>
</html>
